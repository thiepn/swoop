<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swoop">
  <title>Swoop</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root{color-scheme:dark;--fg:#f4f8ff;--muted:rgba(244,248,255,.68);--panel:rgba(5,10,18,.82);--line:rgba(255,255,255,.14)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#07111f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
    body{position:fixed;inset:0}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
    #hud{position:absolute;inset:0;pointer-events:none;color:var(--fg);padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 14px)}
    #scoreWrap{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.28)}
    #score{font-weight:750;font-size:clamp(24px,7vw,38px);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
    #flow{margin-top:-2px;font-size:13px;font-weight:800;letter-spacing:.12em;opacity:.78}
    #pauseBtn{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);width:46px;height:46px;border:0;border-radius:50%;background:rgba(0,0,0,.20);backdrop-filter:blur(10px);color:#fff;font-size:18px;font-weight:800}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 20px);background:rgba(2,5,10,.42);color:#fff;z-index:5}
    .overlay[hidden]{display:none}
    .card{width:min(92vw,420px);max-height:min(86vh,720px);overflow:auto;border:1px solid rgba(255,255,255,.13);border-radius:28px;background:rgba(4,9,17,.96);box-shadow:0 22px 80px rgba(0,0,0,.34);padding:22px}
    .brand{font-size:42px;line-height:1;font-weight:900;letter-spacing:-.06em;margin:0 0 4px}
    .tag{margin:0 0 20px;color:rgba(255,255,255,.65);font-size:14px}
    h2{font-size:16px;margin:20px 0 10px}
    .modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    button,.select{font:inherit}
    .btn{appearance:none;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 15px;background:rgba(255,255,255,.075);color:#fff;font-weight:800;text-align:left;min-height:58px}
    .btn:active{transform:scale(.985);background:rgba(255,255,255,.12)}
    .btn.primary{background:#fff;color:#0a1020;border-color:#fff}
    .btn small{display:block;font-weight:550;opacity:.62;margin-top:2px;line-height:1.25}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    .row:last-child{border-bottom:0}
    select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);border-radius:12px;color:#fff;padding:9px 12px;font-weight:700}
    select option{color:#111}
    .toggle{appearance:none;width:48px;height:28px;border-radius:99px;border:0;background:rgba(255,255,255,.17);position:relative;flex:none}
    .toggle:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.16s}
    .toggle.on{background:#71e7b2}
    .toggle.on:after{left:23px}
    #resultCard{text-align:center}
    #resultScore{font-size:68px;font-weight:900;letter-spacing:-.07em;line-height:.95;font-variant-numeric:tabular-nums}
    #bestText{font-size:12px;font-weight:900;letter-spacing:.16em;opacity:.66;margin-top:8px}
    #resultStats{display:flex;justify-content:center;gap:24px;margin:24px 0 18px;color:rgba(255,255,255,.75);font-size:13px}
    #tapAgain{font-weight:800;letter-spacing:.08em;font-size:12px;opacity:.82}
    #toast{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);z-index:4;color:#fff;font-weight:900;letter-spacing:.12em;font-size:13px;text-shadow:0 2px 14px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;pointer-events:none}
    #toast.show{opacity:1}
    #tutorial{position:absolute;left:50%;bottom:19%;transform:translateX(-50%);z-index:4;color:#fff;font-weight:850;font-size:13px;letter-spacing:.12em;text-shadow:0 2px 12px rgba(0,0,0,.4);pointer-events:none}
    #dailyLabel{position:absolute;top:calc(env(safe-area-inset-top) + 22px);left:calc(env(safe-area-inset-left) + 18px);font-size:10px;font-weight:900;letter-spacing:.14em;opacity:.55}
    .footer{margin-top:16px;text-align:center;color:rgba(255,255,255,.44);font-size:11px}
    .hiddenHud #scoreWrap,.hiddenHud #dailyLabel{display:none}
    .minimalHud #flow,.minimalHud #dailyLabel{display:none}
    @media (prefers-reduced-motion: reduce){.toggle:after{transition:none}}
  </style>
</head>
<body>
<canvas id="game" aria-label="Swoop game canvas"></canvas>

<div id="hud">
  <div id="dailyLabel"></div>
  <div id="scoreWrap"><div id="score">0</div><div id="flow">×1</div></div>
  <button id="pauseBtn" aria-label="Pause">Ⅱ</button>
</div>
<div id="toast"></div>
<div id="tutorial" hidden>HOLD TO DIVE</div>

<div id="home" class="overlay" hidden>
  <div class="card">
    <div class="brand">Swoop</div>
    <div class="tag">Dive. Fly. Flow.</div>
    <div class="modes">
      <button class="btn modeBtn" data-mode="classic">Classic<small>High-score runs</small></button>
      <button class="btn primary modeBtn" data-mode="chill">Chill<small>No game over</small></button>
      <button class="btn modeBtn" data-mode="zen">Zen<small>No HUD, no pressure</small></button>
      <button class="btn modeBtn" data-mode="speed">Speed<small>Faster and wider</small></button>
      <button class="btn modeBtn" data-mode="lowg">Low-G<small>Huge floating arcs</small></button>
      <button class="btn modeBtn" data-mode="daily">Daily<small>Same seed all day</small></button>
    </div>
    <h2>Best</h2>
    <div class="row"><span>Classic</span><strong id="homeBest">0</strong></div>
    <div class="footer">Everything is available immediately. Nothing to unlock.</div>
  </div>
</div>

<div id="pause" class="overlay" hidden>
  <div class="card">
    <div class="brand" style="font-size:28px">Paused</div>
    <div class="tag" id="pauseMode">Classic</div>
    <div class="modes">
      <button class="btn primary" id="resumeBtn">Resume</button>
      <button class="btn" id="restartBtn">Restart</button>
    </div>
    <h2>Mode</h2>
    <div class="modes">
      <button class="btn modeBtn" data-mode="classic">Classic</button>
      <button class="btn modeBtn" data-mode="chill">Chill</button>
      <button class="btn modeBtn" data-mode="zen">Zen</button>
      <button class="btn modeBtn" data-mode="speed">Speed</button>
      <button class="btn modeBtn" data-mode="lowg">Low-G</button>
      <button class="btn modeBtn" data-mode="daily">Daily</button>
    </div>
    <h2>Feel</h2>
    <div class="row"><span>Theme</span><select id="themeSelect">
      <option value="midnight">Midnight</option>
      <option value="sunset">Sunset</option>
      <option value="glacier">Glacier</option>
      <option value="ember">Ember</option>
      <option value="paper">Paper</option>
      <option value="amoled">AMOLED</option>
    </select></div>
    <div class="row"><span>Sound</span><button class="toggle" id="soundToggle" aria-label="Toggle sound"></button></div>
    <div class="row"><span>Haptics</span><button class="toggle" id="hapticToggle" aria-label="Toggle haptics"></button></div>
    <div class="row"><span>Reduced motion</span><button class="toggle" id="motionToggle" aria-label="Toggle reduced motion"></button></div>
    <div class="row"><span>High contrast</span><button class="toggle" id="contrastToggle" aria-label="Toggle high contrast"></button></div>
    <div class="row"><span>HUD</span><select id="hudSelect">
      <option value="standard">Standard</option>
      <option value="minimal">Minimal</option>
      <option value="hidden">Hidden</option>
    </select></div>
    <h2>Data</h2>
    <div class="row"><span>Total runs</span><strong id="runsStat">0</strong></div>
    <div class="row"><span>Perfect landings</span><strong id="perfectStat">0</strong></div>
    <button class="btn" id="homeBtn" style="width:100%;margin-top:16px;text-align:center">Home</button>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="card" id="resultCard">
    <div id="resultScore">0</div>
    <div id="bestText">BEST 0</div>
    <div id="resultStats"><span id="distanceText">0 m</span><span id="perfectText">0 perfect</span><span id="flowText">×1 flow</span></div>
    <div id="tapAgain">TAP TO RETRY</div>
  </div>
</div>

<script>
(function(){
"use strict";

var VERSION="1.1.1";
var FIXED_DT=1/120;
var MAX_STEPS=8;
var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var hud=document.getElementById("hud");
var scoreEl=document.getElementById("score");
var flowEl=document.getElementById("flow");
var toast=document.getElementById("toast");
var tutorial=document.getElementById("tutorial");
var dailyLabel=document.getElementById("dailyLabel");
var home=document.getElementById("home");
var pauseOverlay=document.getElementById("pause");
var resultOverlay=document.getElementById("result");
var pauseBtn=document.getElementById("pauseBtn");
var DPR=1,W=0,H=0,lastTime=0,acc=0,raf=0;
var state="boot";
var inputDown=false;
var currentPointer=null;
var startedAt=0;
var toastTimer=0;
var tutorialTeach=false;
var trailClock=0;
var idleRenderAt=0;
var renderShakeX=0,renderShakeY=0;
var lastMotionX=0,lastMotionAt=0,lastRuntimeError="";

var DEFAULT_SAVE={
  version:1,
  firstRun:true,
  settings:{mode:"chill",theme:"midnight",sound:true,haptics:true,reducedMotion:false,highContrast:false,hud:"standard"},
  best:{classic:0,speed:0,lowg:0,daily:0},
  stats:{runs:0,perfect:0,totalDistance:0}
};
function clone(o){return JSON.parse(JSON.stringify(o));}
function loadSave(){
  var out=clone(DEFAULT_SAVE);
  try{
    var raw=localStorage.getItem("swoop-save");
    if(!raw)return out;
    var p=JSON.parse(raw);
    if(p&&typeof p==="object"){
      if(p.settings)Object.assign(out.settings,p.settings);
      if(p.best)Object.assign(out.best,p.best);
      if(p.stats)Object.assign(out.stats,p.stats);
      out.firstRun=!!p.firstRun;
    }
  }catch(e){}
  return out;
}
var save=loadSave();
function persist(){
  try{localStorage.setItem("swoop-save",JSON.stringify(save));lastSafeSave=performance.now();}catch(e){}
}
function persistEventually(){
  var now=performance.now();
  if(now-lastSafeSave>5000)persist();
}
function validMode(m){return ["classic","chill","zen","speed","lowg","daily"].indexOf(m)>=0?m:"chill";}
save.settings.mode=validMode(save.settings.mode);

var THEMES={
  midnight:{sky1:"#07111f",sky2:"#173150",far:"#10253f",near:"#183857",terrain:"#0c1727",edge:"#9ed7ff",ball:"#f8fbff",trail:"rgba(171,225,255,.55)",star:"rgba(255,255,255,.52)",text:"#f4f8ff"},
  sunset:{sky1:"#321c45",sky2:"#ef795f",far:"#6e3e62",near:"#4a2b50",terrain:"#201a34",edge:"#ffd6ad",ball:"#fff5de",trail:"rgba(255,220,170,.58)",star:"rgba(255,238,208,.35)",text:"#fff7ed"},
  glacier:{sky1:"#c6e7f0",sky2:"#effbff",far:"#a9d3df",near:"#84b7c8",terrain:"#31596b",edge:"#f8ffff",ball:"#ffffff",trail:"rgba(255,255,255,.72)",star:"rgba(255,255,255,.7)",text:"#0b2631"},
  ember:{sky1:"#080607",sky2:"#271112",far:"#241012",near:"#351516",terrain:"#0a0909",edge:"#ff7a3d",ball:"#fff4dd",trail:"rgba(255,106,52,.62)",star:"rgba(255,120,60,.42)",text:"#fff7ef"},
  paper:{sky1:"#f1ede2",sky2:"#fbf9f2",far:"#ddd7cb",near:"#cfc8ba",terrain:"#151719",edge:"#151719",ball:"#ffffff",trail:"rgba(20,22,24,.28)",star:"rgba(25,25,25,.16)",text:"#141719"},
  amoled:{sky1:"#000000",sky2:"#000000",far:"#050505",near:"#0b0b0b",terrain:"#000000",edge:"#dff4ff",ball:"#ffffff",trail:"rgba(213,245,255,.5)",star:"rgba(255,255,255,.35)",text:"#ffffff"}
};
function theme(){return THEMES[save.settings.theme]||THEMES.midnight;}

var MODES={
  classic:{label:"Classic",gravity:1120,dive:2.08,start:350,min:200,dragStart:710,drag:0.80,width:1,challenge:1,death:true,hud:true},
  chill:{label:"Chill",gravity:1080,dive:2.0,start:360,min:215,dragStart:725,drag:0.76,width:1.08,challenge:.72,death:false,hud:true},
  zen:{label:"Zen",gravity:1080,dive:2.0,start:360,min:215,dragStart:725,drag:0.76,width:1.09,challenge:.66,death:false,hud:false},
  speed:{label:"Speed",gravity:1250,dive:2.0,start:465,min:270,dragStart:860,drag:.72,width:1.28,challenge:1.06,death:true,hud:true},
  lowg:{label:"Low-G",gravity:710,dive:1.85,start:350,min:205,dragStart:735,drag:.72,width:1.35,challenge:.88,death:true,hud:true},
  daily:{label:"Daily",gravity:1120,dive:2.05,start:330,min:190,dragStart:690,drag:.82,width:1,challenge:1,death:true,hud:true}
};
var mode=MODES[save.settings.mode];

function hashString(s){
  var h=2166136261>>>0;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function RNG(seed){this.s=seed>>>0||0x9e3779b9;}
RNG.prototype.next=function(){
  var x=this.s;
  x^=x<<13;x^=x>>>17;x^=x<<5;
  this.s=x>>>0;
  return (this.s>>>0)/4294967296;
};
RNG.prototype.range=function(a,b){return a+(b-a)*this.next();};
RNG.prototype.pick=function(a){return a[Math.floor(this.next()*a.length)];};

function localDateKey(){
  var d=new Date();
  var y=d.getFullYear(),m=("0"+(d.getMonth()+1)).slice(-2),day=("0"+d.getDate()).slice(-2);
  return y+"-"+m+"-"+day;
}
var runSeed=1,rng=new RNG(1);

var terrain={
  nodes:[],
  phraseHistory:[],
  mood:"flow",
  phraseCount:0,
  spectacleCooldown:0,
  generatedTo:0,
  reset:function(seed){
    rng=new RNG(seed);
    this.nodes.length=0;
    this.phraseHistory.length=0;
    this.phraseCount=0;
    this.spectacleCooldown=0;
    var x=-800,y=120;
    for(var i=0;i<6;i++){this.nodes.push({x:x,y:y});x+=220;y+=(i%2?70:-55);}
    this.generatedTo=x;
    while(this.generatedTo<2600)this.addPhrase("opening");
  },
  height:function(x){
    var n=this.nodes;
    if(n.length<2)return 200;
    var lo=0,hi=n.length-2;
    while(lo<=hi){
      var mid=(lo+hi)>>1;
      if(x<n[mid].x)hi=mid-1;
      else if(x>n[mid+1].x)lo=mid+1;
      else return this.segmentHeight(mid,x);
    }
    if(x<=n[0].x)return n[0].y;
    return n[n.length-1].y;
  },
  segmentHeight:function(i,x){
    var n=this.nodes;
    var p0=n[Math.max(0,i-1)],p1=n[i],p2=n[i+1],p3=n[Math.min(n.length-1,i+2)];
    var dx=p2.x-p1.x;
    if(dx<=0)return p1.y;
    var t=Math.max(0,Math.min(1,(x-p1.x)/dx));
    var m1=(p2.y-p0.y)/Math.max(1,p2.x-p0.x)*dx;
    var m2=(p3.y-p1.y)/Math.max(1,p3.x-p1.x)*dx;
    var t2=t*t,t3=t2*t;
    return (2*t3-3*t2+1)*p1.y+(t3-2*t2+t)*m1+(-2*t3+3*t2)*p2.y+(t3-t2)*m2;
  },
  slope:function(x){
    var e=1.3;
    return (this.height(x+e)-this.height(x-e))/(2*e);
  },
  ensure:function(x,speed){
    var target=x+Math.max(2200,Math.min(6000,speed*4.4));
    var guard=0;
    while(this.generatedTo<target && guard<28){
      var before=this.generatedTo;
      this.addPhrase(this.chooseRole(Math.min(speed,1200)));
      guard++;
      if(!Number.isFinite(this.generatedTo)||this.generatedTo<=before)break;
    }
    if(!Number.isFinite(this.generatedTo)||guard>=28){
      var last=this.nodes[this.nodes.length-1];
      if(!last||!Number.isFinite(last.x)||!Number.isFinite(last.y)){
        this.nodes=[{x:x-400,y:180},{x:x,y:260},{x:x+500,y:150},{x:x+1000,y:250}];
      }else if(this.generatedTo<target){
        this.pushPoint(Math.max(500,target-this.generatedTo+100),60);
      }
    }
    while(this.nodes.length>10 && this.nodes[4].x<x-1600)this.nodes.shift();
  },
  chooseRole:function(speed){
    if(this.phraseCount<4)return "opening";
    if(speed<mode.min*1.12)return "recovery";
    if(this.spectacleCooldown>0)this.spectacleCooldown--;
    var recent=this.phraseHistory.slice(-4);
    var last=recent.length?recent[recent.length-1]:"";
    var chill=(save.settings.mode==="chill"||save.settings.mode==="zen");
    var r=rng.next();
    if(this.spectacleCooldown<=0 && speed>445 && last!=="spectacle" && r<(chill?.13:.09)){
      this.spectacleCooldown=5+Math.floor(rng.next()*5);return "spectacle";
    }
    if(recent.filter(function(v){return v==="challenge";}).length>=2 || last==="challenge")return rng.next()<.7?"flow":"recovery";
    if(last==="recovery")return rng.next()<.72?"flow":"launch";
    if(last==="speed" && rng.next()<.58)return "launch";
    if(last==="launch" && rng.next()<.55)return "flow";
    if(chill){
      if(r<.43)return "flow";
      if(r<.63)return "speed";
      if(r<.82)return "launch";
      if(r<.91)return "recovery";
      return "challenge";
    }
    if(r<.34)return "flow";
    if(r<.53)return "speed";
    if(r<.70)return "launch";
    if(r<.86)return "challenge";
    return "recovery";
  },
  pushPoint:function(dx,dy){
    var last=this.nodes[this.nodes.length-1];
    var width=Math.max(110,dx*mode.width);
    if(last.y>390 && dy>0)dy*=-.45;
    if(last.y<-90 && dy<0)dy*=-.45;
    var ny=Math.max(-190,Math.min(500,last.y+dy));
    var p={x:last.x+width,y:ny};
    this.nodes.push(p);
    this.generatedTo=p.x;
  },
  addPhrase:function(role){
    var w=rng.range(.88,1.13),d=rng.range(.88,1.14);
    var kind=role;
    if(role==="opening"){
      if(this.phraseCount%2===0){this.pushPoint(250*w,115);this.pushPoint(245*w,-145);}
      else{this.pushPoint(230*w,82);this.pushPoint(270*w,-100);}
      kind="flow";
    } else if(role==="flow"){
      var flowVariant=Math.floor(rng.next()*3);
      if(flowVariant===0){
        var waves=2+(rng.next()>.64?1:0);
        for(var i=0;i<waves;i++){this.pushPoint(rng.range(180,245)*w,rng.range(64,100)*d);this.pushPoint(rng.range(200,275)*w,-rng.range(68,105)*d);}
      }else if(flowVariant===1){
        this.pushPoint(rng.range(270,350)*w,rng.range(85,125)*d);
        this.pushPoint(rng.range(300,390)*w,-rng.range(105,145)*d);
        this.pushPoint(rng.range(260,350)*w,rng.range(72,112)*d);
      }else{
        this.pushPoint(rng.range(210,270)*w,rng.range(72,105)*d);
        this.pushPoint(rng.range(250,320)*w,-rng.range(65,95)*d);
        this.pushPoint(rng.range(300,390)*w,rng.range(82,120)*d);
        this.pushPoint(rng.range(270,350)*w,-rng.range(90,125)*d);
      }
    } else if(role==="speed"){
      if(rng.next()<.5){
        this.pushPoint(rng.range(330,430)*w,rng.range(165,235)*d);
        this.pushPoint(rng.range(300,390)*w,-rng.range(125,175)*d);
      }else{
        this.pushPoint(rng.range(240,310)*w,rng.range(110,155)*d);
        this.pushPoint(rng.range(250,330)*w,rng.range(80,130)*d);
        this.pushPoint(rng.range(310,410)*w,-rng.range(165,225)*d);
      }
    } else if(role==="launch"){
      if(rng.next()<.52){
        this.pushPoint(rng.range(250,330)*w,rng.range(135,195)*d);
        this.pushPoint(rng.range(190,250)*w,-rng.range(205,285)*d);
        this.pushPoint(rng.range(360,500)*w,rng.range(75,135)*d);
      }else{
        this.pushPoint(rng.range(320,410)*w,rng.range(155,215)*d);
        this.pushPoint(rng.range(260,330)*w,-rng.range(240,325)*d);

  if(severity>245||ratio>.54)return "rough";

  if(severity<135&&ratio<.27)return "smooth";
  return "good";
}
function landing(q,speed,tangent){

  else if(q==="rough"){retain=.72;flowChain=0;player.squash=.19;camera.shake=Math.max(camera.shake,2.6);feedback("ROUGH",-1);tone("rough");buzz(28);spawnImpact(15);}
  flow=Math.min(5,1+Math.floor(flowChain/2));

  bestFlow=Math.max(bestFlow,flow);

  speed=Math.max(mode.min,speed*retain);

}

  var hidden=save.settings.mode==="zen"||save.settings.hud==="hidden";
  if(hidden)hud.classList.add("hiddenHud");
  else if(save.settings.hud==="minimal")hud.classList.add("minimalHud");
  pauseBtn.style.display=hidden?"block":"block";
  var th=theme();
  document.documentElement.style.setProperty("--fg",th.text);
  document.querySelector('meta[name="theme-color"]').setAttribute("content",th.sky1);
}
function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function loop(t){
  raf=requestAnimationFrame(loop);
  if(!lastTime)lastTime=t;
  var dt=Math.min(.05,Math.max(0,(t-lastTime)/1000));lastTime=t;

  if(state==="playing"){
    try{
      acc+=dt;var steps=0;
      while(acc>=FIXED_DT&&steps<MAX_STEPS){step(FIXED_DT);acc-=FIXED_DT;steps++;}
      if(steps===MAX_STEPS)acc=0;
      updateCamera(dt);
      if(!runtimeFinite())recoverRuntime();

      if(Math.abs(player.x-lastMotionX)>2){
        lastMotionX=player.x;lastMotionAt=t;
      }else if(t-lastMotionAt>900){
        var gy=terrain.height(player.x);
        var sl=terrain.slope(player.x),ln=Math.sqrt(1+sl*sl),tx=1/ln,ty=sl/ln;
        var kick=Math.max(mode.start,mode.min*1.35);
        player.grounded=true;player.air=false;player.airTime=0;
        player.y=gy-player.r;player.vx=tx*kick;player.vy=ty*kick;
        lastMotionX=player.x;lastMotionAt=t;
      }
    }catch(err){
      lastRuntimeError=String(err&&err.message||err);
      console.error("Swoop physics recovered from an error",err);
      recoverRuntime();lastTime=t;acc=0;
    }

    try{render();}
    catch(renderErr){
      lastRuntimeError=String(renderErr&&renderErr.message||renderErr);
      console.error("Swoop render error",renderErr);
    }
  }else if(t-idleRenderAt>220){
    idleRenderAt=t;
    try{render();}catch(renderErr2){lastRuntimeError=String(renderErr2&&renderErr2.message||renderErr2);}
  }
}
function selectMode(m,fromHome){
  m=validMode(m);
  var teach=!!(fromHome&&save.firstRun);
  save.settings.mode=m;mode=MODES[m];
  if(fromHome&&save.firstRun){save.firstRun=false;persist();}else persist();
  pauseOverlay.hidden=true;home.hidden=true;
  resetRun(m==="daily"?dailySeed():undefined);
  if(teach){tutorialTeach=true;tutorial.hidden=false;tutorial.textContent="HOLD TO DIVE";}
}
function syncToggle(el,on){el.classList.toggle("on",!!on);el.setAttribute("aria-pressed",on?"true":"false");}
function syncSettingsUI(){
  document.getElementById("themeSelect").value=save.settings.theme;
  document.getElementById("hudSelect").value=save.settings.hud;
  syncToggle(document.getElementById("soundToggle"),save.settings.sound);
  syncToggle(document.getElementById("hapticToggle"),save.settings.haptics);
  syncToggle(document.getElementById("motionToggle"),save.settings.reducedMotion);
  syncToggle(document.getElementById("contrastToggle"),save.settings.highContrast);
  document.getElementById("runsStat").textContent=save.stats.runs||0;
  document.getElementById("perfectStat").textContent=save.stats.perfect||0;
}
function toggleSetting(k){
  save.settings[k]=!save.settings[k];persist();syncSettingsUI();updateHudMode();
  if(k==="sound"){if(save.settings.sound)resumeAudio();else suspendAudio();}
}

canvas.addEventListener("pointerdown",function(e){
  e.preventDefault();resumeAudio();
  if(state==="result"){resetRun();return;}
  if(state!=="playing")return;
  if(currentPointer===null){currentPointer=e.pointerId;inputDown=true;try{canvas.setPointerCapture(e.pointerId);}catch(err){}}
  if(tutorialTeach){tutorial.textContent="RELEASE TO FLY";tutorialTeach=false;setTimeout(function(){tutorial.hidden=true;},900);}
},{passive:false});
canvas.addEventListener("pointerup",function(e){e.preventDefault();if(e.pointerId===currentPointer){inputDown=false;currentPointer=null;}},{passive:false});
canvas.addEventListener("pointercancel",function(e){inputDown=false;currentPointer=null;},{passive:false});
window.addEventListener("blur",function(){inputDown=false;currentPointer=null;if(state==="playing")pauseGame();});
document.addEventListener("visibilitychange",function(){if(document.hidden){inputDown=false;currentPointer=null;if(state==="playing")pauseGame();persist();suspendAudio();lastTime=performance.now();acc=0;}});
document.addEventListener("contextmenu",function(e){e.preventDefault();});
window.addEventListener("keydown",function(e){
  if(e.code==="Space"){e.preventDefault();resumeAudio();if(state==="playing")inputDown=true;else if(state==="result")resetRun();}
  if(e.code==="Escape"){if(state==="playing")pauseGame();else if(state==="paused")resumeGame();}
  if(e.code==="KeyR"&&state!=="home")resetRun();
});
window.addEventListener("keyup",function(e){if(e.code==="Space")inputDown=false;});
window.addEventListener("resize",resize,{passive:true});

pauseBtn.addEventListener("pointerdown",function(e){e.stopPropagation();e.preventDefault();pauseGame();});
document.getElementById("resumeBtn").addEventListener("click",resumeGame);
document.getElementById("restartBtn").addEventListener("click",function(){resetRun();});
document.getElementById("homeBtn").addEventListener("click",showHome);
document.querySelectorAll(".modeBtn").forEach(function(b){b.addEventListener("click",function(){selectMode(b.getAttribute("data-mode"),!home.hidden);});});
document.getElementById("themeSelect").addEventListener("change",function(e){save.settings.theme=THEMES[e.target.value]?e.target.value:"midnight";persist();updateHudMode();});
document.getElementById("hudSelect").addEventListener("change",function(e){save.settings.hud=e.target.value;persist();updateHudMode();});
document.getElementById("soundToggle").addEventListener("click",function(){toggleSetting("sound");});
document.getElementById("hapticToggle").addEventListener("click",function(){toggleSetting("haptics");});
document.getElementById("motionToggle").addEventListener("click",function(){toggleSetting("reducedMotion");});
document.getElementById("contrastToggle").addEventListener("click",function(){toggleSetting("highContrast");});
resultOverlay.addEventListener("pointerdown",function(e){if(e.target===resultOverlay||e.target.closest("#resultCard")){e.preventDefault();resetRun();}});

function boot(){
  resize();syncSettingsUI();updateHudMode();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
  if(save.firstRun)showHome();else resetRun();
  raf=requestAnimationFrame(loop);
}
boot();

window.SWOOP={
  version:VERSION,
  get seed(){return runSeed;},
  get state(){return state;},
  get player(){return {x:player.x,y:player.y,vx:player.vx,vy:player.vy,grounded:player.grounded};},
  get lastError(){return lastRuntimeError;},
  restartSeed:function(seed){resetRun(seed>>>0);}
};
})();
</script>
</body>
</html>
